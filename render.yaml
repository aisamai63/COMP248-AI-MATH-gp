services:
  - type: web
    name: comp248-ai-math-gp
    env: python
    plan: free
    buildCommand: pip install -r prototype/requirements.txt
    startCommand: bash render_start.sh
    disk:
      name: chroma-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CHROMA_DB_DIR
        value: /var/data/chroma_db
      - key: CHROMADB_DISABLE_TELEMETRY
        value: "true"
      - key: AUTO_INGEST
        value: "1"
      # Set your provider + API key in the Render dashboard (secrets):
      # - LLM_PROVIDER=openai|mistral|gemini
      # - OPENAI_API_KEY / MISTRAL_API_KEY / GEMINI_API_KEY

